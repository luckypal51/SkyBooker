server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
              - "http://13.51.35.80"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

      routes:

        # AUTH SERVICE
        - id: authentication-service
          uri: lb://AUTHENTICATION
          predicates:
            - Path=/auth/**,/login,/oauth2/**

        # ADMIN SERVICE
        - id: admin-service
          uri: lb://AUTHENTICATION
          predicates:
            - Path=/admin/**,/user/**
          filters:
            - AuthenticationFilter

        # PASSENGER SERVICE
        - id: passenger-service
          uri: lb://PASSENGER-SERVICE
          predicates:
            - Path=/passenger/**
          filters:
            - AuthenticationFilter

        # SEATS SERVICE
        - id: seats-service
          uri: lb://SEATS
          predicates:
            - Path=/seats/**,/staff/seat/**
          filters:
            - AuthenticationFilter

        # FLIGHT SERVICE
        - id: flight-service
          uri: lb://SKYBOOKER
          predicates:
            - Path=/flight/**,/staff/flight/**
          filters:
            - AuthenticationFilter

        # BOOKING SERVICE
        - id: booking-service
          uri: lb://BOOKING-SERVICE
          predicates:
            - Path=/booking/**
          filters:
            - AuthenticationFilter

        # PAYMENT PUBLIC
        - id: payment-public
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/payment/success,/payment/cancel,/payments/webhook

        # PAYMENT SECURED
        - id: payment-secured
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/payment/**
          filters:
            - AuthenticationFilter

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG