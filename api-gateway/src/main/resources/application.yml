server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: seats
          uri: lb://SEATS
          predicates:
            - Path=/seats/**, /staff/**

        - id: authentication
          uri: lb://AUTHENTICATION
          predicates:
            - Path=/auth/**, /admin/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka